name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: 問題データのテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: 問題データの形と、計算・トレース問題の正解を確かめる
        run: node tests/check.mjs

  browser:
    name: スマホ幅のブラウザーで動かす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Playwright を入れる
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 解答・採点・解説・オフライン起動まで通す
        run: python tests/smoke.py
